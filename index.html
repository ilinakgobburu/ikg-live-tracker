const KEY = "ikg-tracker-key";
const bytes = s => Uint8Array.from(atob(s.replace(/[-_ ]/g, c => (c === "_" ? "/" : "+"))), c => c.charCodeAt(0));
const say = t => { document.getElementById("msg").textContent = t; };
const keepTab = s => { try { sessionStorage.setItem(KEY, s); } catch (e) {} };     // this tab: survives the reload
const keepDevice = s => { try { localStorage.setItem(KEY, s); } catch (e) {} };    // only if "Remember" is ticked
const forgetDevice = () => { try { localStorage.removeItem(KEY); } catch (e) {} };
const drop = () => { forgetDevice(); try { sessionStorage.removeItem(KEY); } catch (e) {} };
const saved = () => { try { return sessionStorage.getItem(KEY) || localStorage.getItem(KEY); } catch (e) { return null; } };
const clearHash = () => { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} };
async function unlock(key) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(L.iv) }, key, bytes(L.ct));
  return new TextDecoder().decode(pt);
}
function show(html) { document.open(); document.write(html); document.close(); }
async function keyFromPassword(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(L.salt), iterations: L.iter, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
const keyFromRaw = s => crypto.subtle.importKey("raw", bytes(s), "AES-GCM", false, ["decrypt"]);
(async () => {
  if (!window.crypto || !crypto.subtle) { say("This browser cannot open the page (it needs Web Crypto over HTTPS)."); return; }
  if (location.hash === "#forget") { drop(); clearHash(); say("Forgotten on this device."); return; }
  const fromLink = new URLSearchParams(location.hash.slice(1)).get("key");
  const s = fromLink || saved();
  if (!s) return;
  try {
    const html = await unlock(await keyFromRaw(s));
    if (fromLink) { keepTab(fromLink); clearHash(); }
    show(html);
  } catch (e) { if (!fromLink) drop(); say(fromLink ? "This link's key does not open the page." : ""); }
})();
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  say("Opening...");
  try {
    const key = await keyFromPassword(document.getElementById("pw").value);
    const html = await unlock(key);
    const raw = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw", key))));
    keepTab(raw);
    if (document.getElementById("rem").checked) keepDevice(raw); else forgetDevice();
    show(html);
  } catch (e) { say("Wrong password."); }
});
